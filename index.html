<h1>strata-drive</h1>
<p>strata-drive is a personal desktop tool that shows a Google Drive as a folder on a Linux
computer and integrates it with the Strata file manager. It runs entirely on the user's own
computer.</p>
<p>It is a personal project and is not offered as a service to the public.</p>
